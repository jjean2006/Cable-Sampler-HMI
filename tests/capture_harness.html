<!DOCTYPE html>
<html>
<head>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 1280px; height: 800px; border: none; }
  </style>
</head>
<body>
  <iframe id="app-frame" src="/index.html"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const view = params.get('view') || 'current-job';
    const unlock = params.get('unlock') !== '0';
    const modal = params.get('modal') === '1';
    const pause = params.get('pause') === '1';
    const estop = params.get('estop') === '1';
    const filter = params.get('filter');

    const frame = document.getElementById('app-frame');
    frame.onload = () => {
      const doc = frame.contentDocument;
      const win = frame.contentWindow;

      // Disable CSS transitions and animations for 100% deterministic rendering
      const noAnimStyle = doc.createElement('style');
      noAnimStyle.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; }';
      doc.head.appendChild(noAnimStyle);

      // Mock alert and confirm to avoid dialog blocking in headless Chrome
      win.alert = () => {};
      win.confirm = () => true;

      // 1. Handle auth unlock
      if (unlock) {
        const authScreen = doc.getElementById('auth-screen');
        if (authScreen) authScreen.classList.add('hidden');
      }

      // 2. Freeze dynamic clock & uptime for 100% deterministic visual regression
      const clock = doc.getElementById('header-clock');
      if (clock) clock.textContent = '19:28:45';
      const headerUptime = doc.getElementById('header-uptime');
      if (headerUptime) headerUptime.textContent = '28h 14m 32s';
      const jobUptime = doc.getElementById('current-job-uptime');
      if (jobUptime) jobUptime.textContent = '28h 14m 32s';
      const elapsed = doc.getElementById('job-elapsed-time');
      if (elapsed) elapsed.textContent = '02m 45s';
      const eta = doc.getElementById('job-eta-time');
      if (eta) eta.textContent = '01m 15s';
      const pct = doc.getElementById('job-progress-percent');
      if (pct) pct.textContent = '68%';
      const fill = doc.getElementById('job-progress-fill');
      if (fill) fill.style.width = '68%';

      // 3. Switch view
      if (win.HMI && win.HMI.switchView) {
        win.HMI.switchView(view);
      }

      // 4. Modal state
      if (modal && win.HMI) {
        const modalEl = doc.getElementById('job-creation-modal');
        if (modalEl) modalEl.classList.add('show');
      }

      // 5. Pause state
      if (pause && win.HMI) {
        win.HMI.togglePause();
      }

      // 6. E-stop state
      if (estop && win.HMI) {
        win.HMI.triggerEstop();
      }

      // 7. Filter history
      if (filter && win.HMI && win.HMI.filterHistory) {
        win.HMI.filterHistory(filter);
      }

      // Mark ready for screenshot
      document.body.setAttribute('data-ready', 'true');
      console.log('VIEW_READY_FOR_SCREENSHOT: ' + view);
    };
  </script>
</body>
</html>
